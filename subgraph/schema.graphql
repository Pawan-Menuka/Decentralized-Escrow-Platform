type Job @entity(immutable: false) {
  id: ID! # jobId as string
  jobId: BigInt!
  client: Bytes!
  freelancer: Bytes!
  # Not carried in JobCreated — read from the contract in handleJobCreated. Needed so
  # the arbitrator desk can find jobs by arbitrator without falling back to RPC.
  arbitrator: Bytes!
  token: Bytes!
  totalAmount: BigInt!
  milestoneCount: BigInt!
  approvedMilestoneCount: BigInt!
  openDisputeCount: BigInt!
  timelock: BigInt!
  state: String!
  createdAt: BigInt!
  updatedAt: BigInt!
  acceptedAt: BigInt
  cancelledAt: BigInt
  usdTotal: BigInt
  ethUsdPrice: BigInt
  completedAt: BigInt
  arbitratorVerified: Boolean!
  milestonesHydrated: Boolean!
  milestones: [Milestone!]! @derivedFrom(field: "job")
  activities: [Activity!]! @derivedFrom(field: "job")
}

type Milestone @entity(immutable: false) {
  id: ID! # `<jobId>-<index>`
  job: Job!
  index: BigInt!
  amount: BigInt!
  amountVerified: Boolean!
  state: String!
  deliverableCid: String
  submittedAt: BigInt
  fee: BigInt
  resolvedFreelancerBps: Int
}

type Activity @entity(immutable: false) {
  id: ID! # `<txHash>-<logIndex>`
  job: Job
  type: String!
  milestoneIndex: BigInt
  actor: Bytes
  timestamp: BigInt!
  txHash: Bytes!
  data: String
}

type Withdrawal @entity(immutable: false) {
  id: ID! # `<txHash>-<logIndex>`
  account: Bytes!
  token: Bytes!
  amount: BigInt!
  timestamp: BigInt!
}

type Dispute @entity(immutable: false) {
  id: ID! # `<jobId>-<mIndex>`
  job: Job!
  milestoneIndex: BigInt!
  raisedBy: Bytes!
  evidenceCid: String
  resolved: Boolean!
  freelancerBps: Int
  freelancerAmount: BigInt
  clientAmount: BigInt
  timestamp: BigInt!
  resolvedAt: BigInt
}
