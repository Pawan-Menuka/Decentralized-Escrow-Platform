specVersion: 1.0.0
description: Subgraph indexing the FreelanceEscrow milestone-based escrow contract on Sepolia.
repository: https://github.com/Pawan-Menuka/Decentralized-Escrow-Platform
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FreelanceEscrow
    network: sepolia
    source:
      address: "0x85DBE339432cd7960FADFef78e2E6981025bD4BA"
      abi: FreelanceEscrow
      startBlock: 11287638
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Job
        - Milestone
        - Activity
        - Withdrawal
        - Dispute
      abis:
        - name: FreelanceEscrow
          file: ./abis/FreelanceEscrow.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,indexed address,address,uint256,uint256,uint32)
          handler: handleJobCreated
        - event: JobCreatedUsd(indexed uint256,uint256,uint256)
          handler: handleJobCreatedUsd
        - event: JobAccepted(indexed uint256,indexed address)
          handler: handleJobAccepted
        - event: JobCancelled(indexed uint256)
          handler: handleJobCancelled
        - event: JobCompleted(indexed uint256)
          handler: handleJobCompleted
        - event: MilestoneSubmitted(indexed uint256,indexed uint256,string)
          handler: handleMilestoneSubmitted
        - event: MilestoneApproved(indexed uint256,indexed uint256,uint256,uint256)
          handler: handleMilestoneApproved
        - event: MilestoneRejected(indexed uint256,indexed uint256,string)
          handler: handleMilestoneRejected
        - event: MilestoneAutoReleased(indexed uint256,indexed uint256,uint256,uint256)
          handler: handleMilestoneAutoReleased
        - event: DisputeRaised(indexed uint256,indexed uint256,indexed address,string)
          handler: handleDisputeRaised
        - event: DisputeResolved(indexed uint256,indexed uint256,uint16,uint256,uint256,uint256)
          handler: handleDisputeResolved
        - event: Withdrawal(indexed address,indexed address,uint256)
          handler: handleWithdrawal
        - event: FeeUpdated(uint16,uint16)
          handler: handleFeeUpdated
        - event: FeesWithdrawn(indexed address,uint256)
          handler: handleFeesWithdrawn
        - event: ArbitratorUpdated(indexed address,indexed address)
          handler: handleArbitratorUpdated
      file: ./src/mapping.ts
